# Vale config: house-style checks for maintainer-owned docs.
# Rules live in .github/vale/Lambda/. Run locally with `vale .`
# (https://vale.sh/docs/install). Code spans and code blocks are skipped.
StylesPath = .github/vale
MinAlertLevel = error

[*.md]
BasedOnStyles = Lambda

# Submitted solutions are the submitter's writing, not ours; only the
# template is linted.
[solutions/*.md]
BasedOnStyles =

[solutions/LP-0000.md]
BasedOnStyles = Lambda
