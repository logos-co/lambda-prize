[package]
name = "lez-events"
version = "0.3.0"
edition = "2021"
description = "Reliability-focused SDK and helpers for structured LEZ events"
license = "MIT OR Apache-2.0"

[features]
default = []
std = ["serde", "serde_json", "hex", "toml"]
encryption = ["aes-gcm"]
test-stub = []

[dependencies]
borsh      = { version = "1", default-features = false, features = ["derive"] }
aes-gcm    = { version = "0.10", optional = true }
serde      = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
hex        = { version = "0.4", optional = true }
sha2       = { version = "0.10", default-features = false }
toml       = { version = "0.8", optional = true }

[dev-dependencies]
borsh      = { version = "1", features = ["derive"] }
hex        = "0.4"
serde_json = "1"
tempfile   = "3"

[[test]]
name = "serialization"
path = "tests/serialization.rs"
required-features = ["test-stub"]

[[test]]
name = "usability"
path = "tests/usability.rs"
required-features = ["std"]

[[test]]
name = "e2e"
path = "tests/e2e.rs"

[[test]]
name = "codec"
path = "tests/codec.rs"
required-features = ["test-stub"]

[[test]]
name = "batch"
path = "tests/batch.rs"
required-features = ["test-stub"]

[[test]]
name = "diagnostics"
path = "tests/diagnostics.rs"
required-features = ["std", "test-stub"]
