name: Add solutions to project

# `pull_request_target` is used because solutions are submitted from forks,
# and `pull_request` runs from forks get no secrets (so no ADD_TO_PROJECT_PAT).
# It runs on the base branch and never checks out or executes the fork's
# tree: the only PR input used is the title, in the `if:` expression below.
# This workflow only adds the PR to the board and sets two fields; it never
# edits, closes, or merges the PR.
on:
  pull_request_target:
    types:
      - opened

permissions:
  contents: read

jobs:
  add-to-project:
    name: Add solution PR to project
    # Solution PRs are titled `Solution: LP-xxxx — <name>`. Anchor on the
    # prefix only: other PRs mention LP numbers without being submissions.
    if: startsWith(github.event.pull_request.title, 'Solution:')
    runs-on: ubuntu-latest
    steps:
      - id: add-to-project
        uses: actions/add-to-project@v1.0.2
        with:
          # Organization project URL
          # Format: https://github.com/orgs/<org>/projects/<number>
          project-url: https://github.com/orgs/logos-co/projects/18
          # A GitHub PAT or app token with `project` scope is required
          # Create a fine-grained PAT with "Projects" read/write access
          # or use a GitHub App with "Organization projects" permissions
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}

      - name: Set Category and Status fields
        if: steps.add-to-project.outputs.itemId != ''
        uses: actions/github-script@v7
        env:
          ITEM_ID: ${{ steps.add-to-project.outputs.itemId }}
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          script: |
            const projectId = "PVT_kwDOBmg7884BfoPW";
            const categoryFieldId = "PVTSSF_lADOBmg7884BfoPWzhZ5zSM";
            const categoryOptionId = "0ea4a665"; // LPrize
            const statusFieldId = "PVTSSF_lADOBmg7884BfoPWzhZ5zQ0";
            // Status option: "Proposals & Submissions to review"
            const statusOptionId = "f8d53801";

            const setField = (fieldId, optionId) => github.graphql(`
              mutation(
                $projectId: ID!
                $itemId: ID!
                $fieldId: ID!
                $optionId: String!
              ) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            `, {
              projectId,
              itemId: process.env.ITEM_ID,
              fieldId,
              optionId,
            });

            await setField(categoryFieldId, categoryOptionId);
            await setField(statusFieldId, statusOptionId);
